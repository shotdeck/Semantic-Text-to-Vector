trigger:
- main

# Only build on merges to main: a PR build published a second "drop" artifact,
# so every merge deployed twice.
pr: none

pool:
  vmImage: 'windows-latest'

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
  # --- Deployment (set these as pipeline variables in Azure DevOps) ---
  # azureServiceConnection: name of the ARM service connection. The Deploy
  #   stage is skipped while this is empty, so the existing release pipeline
  #   that consumes the "drop" artifact keeps working unchanged.
  # webAppName / resourceGroup: from Properties/PublishProfiles/*.pubxml
  # slotName: the deployment slot to warm before swapping into production
  webAppName: 'shotdecksearch'
  resourceGroup: 'ShotdeckSearch'
  slotName: 'staging'

stages:
- stage: Build
  jobs:
  - job: Build
    steps:
    - task: NuGetToolInstaller@1

    - task: NuGetCommand@2
      inputs:
        restoreSolution: '$(solution)'

    - task: VSBuild@1
      inputs:
        solution: '$(solution)'
        msbuildArgs: >
          /p:DeployOnBuild=true
          /p:WebPublishMethod=Package
          /p:PackageAsSingleFile=true
          /p:SkipInvalidConfigurations=true
          /p:PackageLocation="$(Build.ArtifactStagingDirectory)"
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'

    - task: VSTest@2
      displayName: 'Run xUnit tests'
      inputs:
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

# Deploy to the slot, load the keyword cache from the database there, and only
# then swap it into production. Production keeps serving its warm cache the
# whole time; the slot's SshTunnelService picks a free loopback port
# (TunnelPortSelector) so it never fights production for 127.0.0.1:5433.
- stage: Deploy
  dependsOn: Build
  condition: and(succeeded(), ne(variables['azureServiceConnection'], ''))
  jobs:
  - deployment: WarmSlotAndSwap
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - download: current
            artifact: drop

          - task: AzureWebApp@1
            displayName: 'Deploy to $(slotName) slot'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: 'webApp'
              appName: '$(webAppName)'
              resourceGroupName: '$(resourceGroup)'
              deployToSlotOrASE: true
              slotName: '$(slotName)'
              package: '$(Pipeline.Workspace)/drop/**/*.zip'

          - task: AzureCLI@2
            displayName: 'Warm keyword cache on $(slotName), then swap to production'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'scriptPath'
              scriptPath: '$(Build.SourcesDirectory)/deploy/Warm-Slot-And-Swap.ps1'
              arguments: >
                -ResourceGroup "$(resourceGroup)"
                -WebAppName "$(webAppName)"
                -SlotName "$(slotName)"
